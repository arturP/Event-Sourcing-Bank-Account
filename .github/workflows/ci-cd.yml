name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode clean test

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  image:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The image is built but not published. This project has no deployment
      # target; the job exists so the Dockerfile cannot rot unnoticed.
      - name: Build the container image
        run: docker build --tag event-sourcing-bank-account:ci .
